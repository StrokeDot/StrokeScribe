name: Convert TEED line-art model to ONNX
on:
  pull_request:
    paths:
      - 'tools/convert_teed.py'
      - '.github/workflows/convert-teed.yml'
permissions:
  contents: write
  pull-requests: write
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install onnx onnxscript onnxruntime numpy
      - run: git clone --depth 1 https://github.com/xavysp/TEED TEED
      - name: Convert
        id: convert
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python tools/convert_teed.py 2>&1 | tee convert.log
      - name: Report conversion output
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          {
            echo "### TEED conversion: ${{ steps.convert.outcome }}"
            echo '```text'
            tail -n 60 convert.log || true
            echo '```'
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md
      - name: Stop if conversion failed
        if: steps.convert.outcome == 'failure'
        run: exit 1
      - name: Commit model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/teed.onnx
          git diff --cached --quiet || git commit -m "Add TEED line-art model (ONNX, MIT) converted by CI"
          git push
