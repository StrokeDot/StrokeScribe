name: Filmora OFX test plugin
on:
  push:
    branches: [feature/filmora-ofx-test]
    paths: ['ofx/**', '.github/workflows/ofx-test-plugin.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get OpenFX and stb (pinned)
        shell: bash
        run: |
          git clone -q https://github.com/AcademySoftwareFoundation/openfx deps/openfx
          git -C deps/openfx checkout -q c3f1c2dcf4f51762b794c4fc21181b4a501be1bf
          git clone -q https://github.com/nothings/stb deps/stb
          git -C deps/stb checkout -q a7d4c2175630e1ea5b6f8dd00ab96fed0b97b96d
      - name: Build (MSVC x64 Release)
        shell: bash
        run: |
          cmake -S ofx -B build -A x64 -DOFX_INCLUDE="$PWD/deps/openfx/include" -DSTB_DIR="$PWD/deps/stb"
          cmake --build build --config Release
      - name: Sign with a one-off certificate (private key deleted after)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=StrokeScribe Local Plugin Signing" `
            -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy NonExportable -NotAfter (Get-Date).AddYears(5)
          Export-Certificate -Cert $cert -FilePath StrokeScribe-signing.cer | Out-Null
          $st = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
                Where-Object { $_.FullName -like "*\x64\*" } | Sort-Object FullName | Select-Object -Last 1
          & $st.FullName sign /fd SHA256 /sha1 $cert.Thumbprint /tr http://timestamp.digicert.com /td SHA256 build/Release/StrokeScribeTest.ofx
          if ($LASTEXITCODE -ne 0) {
            & $st.FullName sign /fd SHA256 /sha1 $cert.Thumbprint build/Release/StrokeScribeTest.ofx
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          Get-AuthenticodeSignature build/Release/StrokeScribeTest.ofx | Format-List SignerCertificate, Status
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -DeleteKey
          if (Test-Path "Cert:\CurrentUser\My\$($cert.Thumbprint)") { exit 1 }
          Write-Host "Private key deleted."
      - name: Crash test in a small OFX host
        shell: bash
        run: |
          mkdir -p frames
          LOCALAPPDATA="$PWD/frames" build/Release/ofx_test_host.exe build/Release/StrokeScribeTest.ofx frames
          cat frames/StrokeScribe/ofx-test.log
      - name: Package bundle
        shell: pwsh
        run: |
          $b = "pkg/StrokeScribeTest.ofx.bundle/Contents/Win64"
          New-Item -ItemType Directory -Force $b | Out-Null
          Copy-Item build/Release/StrokeScribeTest.ofx $b/
          $r = "pkg/StrokeScribeTest.ofx.bundle/Contents/Resources"
          New-Item -ItemType Directory -Force $r | Out-Null
          Copy-Item assets/strokescribe_icon.png "$r/com.strokedot.strokescribe.test.png"
          Copy-Item assets/strokescribe_icon.png "$r/StrokeScribe.png"
          Compress-Archive -Path pkg/StrokeScribeTest.ofx.bundle -DestinationPath StrokeScribeTest-ofx-win64.zip
          Compress-Archive -Path frames/*.png -DestinationPath test-frames.zip
      - name: Publish prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ofx-test-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" StrokeScribeTest-ofx-win64.zip test-frames.zip StrokeScribe-signing.cer --prerelease --target "$GITHUB_SHA" \
            --title "Filmora OFX test plugin (build ${GITHUB_RUN_NUMBER})" \
            --notes "Test plugin for Filmora. Unzip and copy StrokeScribeTest.ofx.bundle into C:\\Program Files\\Common Files\\OFX\\Plugins, then restart Filmora."
