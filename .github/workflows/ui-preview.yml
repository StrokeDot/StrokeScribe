name: UI preview screenshots
on:
  push:
    branches: [fix/svg-guide-coverage-experimental12]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 fonts-dejavu
      - run: pip install -r requirements.txt
      - run: python render_studio_preview.py | grep -v STUDIO_REVIEW_BASE64
      - name: Export speed (one core vs all cores)
        run: QT_QPA_PLATFORM=offscreen python -m unittest test_speed.ParallelExportTests.test_speed 2>&1 | tee samples/studio-preview/export-speed.txt || true
      - name: Publish screenshots to the ui-previews branch
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/previews && cp samples/studio-preview/*.png samples/studio-preview/*.gif samples/studio-preview/*.txt /tmp/previews/ 2>/dev/null || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin ui-previews || true
          git checkout --orphan ui-previews-new
          git rm -rfq . >/dev/null
          rm -rf ./*
          cp /tmp/previews/* .
          echo "Screenshots for ${GITHUB_SHA}" > README.md
          git add -A
          git commit -qm "UI previews for ${GITHUB_SHA}"
          git push -f origin HEAD:ui-previews
