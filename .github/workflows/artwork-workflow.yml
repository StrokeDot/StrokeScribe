name: Artwork workflow review
on:
  pull_request:
    paths:
      - '*.py'
      - '.github/workflows/artwork-workflow.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: artwork-workflow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    # Intermediate iteration only; full checks restored before delivery.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: |
          pip install --only-binary=:all: -r requirements.txt
      - name: Artwork regression tests
        run: python -X faulthandler -c "import pathlib,runpy,sys,applog,logging,unittest,traceback; original_error=unittest.TextTestResult.addError; unittest.TextTestResult.addError=lambda self,test,err:(original_error(self,test,err),traceback.print_exception(*err)); applog.setup(); applog.log.addHandler(logging.StreamHandler(sys.stderr)); sys.argv=['tools/run_tests.py','--limit','120']+[p.stem for p in sorted(pathlib.Path('.').glob('test_artwork*.py'))]+['test_blend_modes','test_project_leave_decisions','test_svg_export','test_image_source','test_studio','test_one_timeline']; runpy.run_path('tools/run_tests.py',run_name='__main__')"
      - name: Review frames and source ZIP
        if: hashFiles('render_artwork_workflow.py') != ''
        run: |
          python render_artwork_workflow.py --review-log-images
          python package_prototype.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Artwork-workflow-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            samples/artwork-workflow/
            dist/*.zip
