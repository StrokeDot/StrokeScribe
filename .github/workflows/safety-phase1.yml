name: Phase 0–1 project-data safety checks
on:
  pull_request:
    paths:
      - 'project_lifecycle.py'
      - 'test_project_lifecycle.py'
      - 'test_stability_baseline.py'
      - 'test_library.py'
      - 'library.py'
      - 'app.py'
      - 'autosave.py'
      - 'projects.py'
      - '.github/workflows/safety-phase1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 ffmpeg
      - run: python -m pip install --only-binary=:all: -r requirements.txt
      - run: python -m compileall -q .
      - name: Verify project safety and preserved rendering
        run: python tools/run_tests.py test_stability_baseline test_project_lifecycle test_library test_timeline_autosave test_projects_sound_batch test_board test_overlays
