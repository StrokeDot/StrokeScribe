name: AI sound samples
on:
  push:
    paths:
      - 'ai_models.py'
      - 'ai_workflows.py'
      - 'ai_engine.py'
      - 'tools/ci_sound_samples.py'
      - '.github/workflows/ai-sound.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stable-audio-on-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install ComfyUI (CPU) the same way the app does
        run: |
          python - <<'PY'
          import urllib.request, sys
          sys.path.insert(0, '.')
          import ai_engine
          from pathlib import Path
          ai_engine._extract_zip(urllib.request.urlopen(ai_engine.COMFY_ZIP).read(), Path('/tmp/engine/ComfyUI'))
          PY
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r /tmp/engine/ComfyUI/requirements.txt
          pip install numpy pillow opencv-python-headless
      - name: Cache the model files
        uses: actions/cache@v4
        with:
          path: /tmp/engine/data/models
          key: stable-audio-3-small-sfx-v1
      - name: Make sample sounds with Stable Audio 3 Small-SFX
        run: python tools/ci_sound_samples.py /tmp/engine/ComfyUI /tmp/engine/data /tmp/sound-samples
      - name: Publish the samples to the sound-previews branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan sound-previews-new
          git rm -rfq . >/dev/null
          rm -rf ./*
          cp /tmp/sound-samples/* .
          echo "Sound samples for ${GITHUB_SHA}" > README.md
          git add -A
          git commit -qm "Sound samples for ${GITHUB_SHA}"
          git push -f origin HEAD:sound-previews
