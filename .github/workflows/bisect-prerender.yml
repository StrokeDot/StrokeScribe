name: Bisect pre-render
on:
  push:
    branches: [ci/bisect-prerender]
permissions:
  contents: write
jobs:
  bisect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: pip install -r requirements.txt
      - name: Which earlier test breaks the pre-render tests
        shell: bash
        run: |
          mkdir -p out
          git worktree add -f "$RUNNER_TEMP/v94" 804eb28 >/dev/null 2>&1
          cd "$RUNNER_TEMP/v94"
          for m in test_studio test_workspace_layout test_ui_control_regression test_menus test_timeline_autosave test_render_pipeline_smoke test_element_kinds test_dual_sidebar test_inspector_scene_switch test_png_cleanup test_source_mode_consistency test_source_timeline test_prototype; do
            timeout 900 python tools/run_tests.py $m test_segment_cache.WindowTests > "$GITHUB_WORKSPACE/out/$m.txt" 2>&1
            echo "$m -> $(tail -1 $GITHUB_WORKSPACE/out/$m.txt)" | tee -a "$GITHUB_WORKSPACE/out/summary.txt"
          done
      - name: Publish
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out && git init -q && git checkout -q -b bisect-prerender
          git config user.name ci && git config user.email ci@example.invalid
          git add -A && git commit -qm "bisect" && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" bisect-prerender
