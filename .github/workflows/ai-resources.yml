name: AI resource awareness review
on:
  pull_request:
    paths: ['*.py', '.github/workflows/ai-resources.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-resources-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: pip install --only-binary=:all: -r requirements.txt
      - name: Resource, diagnostics and lifecycle regressions
        run: python -X faulthandler -c "import applog,runpy,logging,sys,pathlib; applog.setup(); applog.log.addHandler(logging.StreamHandler(sys.stderr)); sys.argv=['tools/run_tests.py','--limit','120']+[p.stem for p in sorted(pathlib.Path('.').glob('test_ai_resource*.py'))]+[p.stem for p in sorted(pathlib.Path('.').glob('test_ai_diagnostic*.py'))]+['test_source_ai_lifecycle','test_owned_process','test_ai','test_generator_polish','test_image_generator_updates']; runpy.run_path('tools/run_tests.py',run_name='__main__')"
      - name: Candidate source ZIP
        if: success()
        run: python package_prototype.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AI-resources-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            dist/*.zip
            samples/ai-resources/
