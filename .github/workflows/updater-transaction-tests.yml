name: Updater transaction fault-injection checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transaction-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_update_transaction test_updater.UpdaterTests
  transaction-windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest -v test_update_transaction test_updater.UpdaterTests
