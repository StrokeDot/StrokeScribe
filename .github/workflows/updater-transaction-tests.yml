name: Updater transaction checks
on:
  push:
    branches:
      - safety/controlled-refactor-phase6
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transaction-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify updater and transaction regressions
        run: python -m unittest -v test_update_transaction test_updater.UpdaterTests
