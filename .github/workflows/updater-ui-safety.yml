name: Updater UI safety
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  updater-ui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 ffmpeg
      - run: python -m pip install --only-binary=:all: -r requirements.txt
      - run: python -m unittest -v test_updater_ui_safety test_updater.UpdateWindowTests test_updater.UpdaterTests
